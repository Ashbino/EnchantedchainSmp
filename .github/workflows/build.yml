cd /d "%~dp0"
py -m pip install --upgrade pip
if errorlevel 1 (
  echo.
  echo Python could not be found. Install Python 3.11 or newer and enable Add Python to PATH.
  pause
  exit /b 1
)
py -m pip install send2trash
if errorlevel 1 (
  echo.
  echo Package installation failed. Check your internet connection and Python setup.
  pause
  exit /b 1
)
echo.
echo Setup complete. Double-click run.bat to launch Storage Guardian.
pause
'''

run_bat = r'''@echo off
title Storage Guardian
cd /d "%~dp0"
py storage_guardian.py
if errorlevel 1 (
  echo.
  echo Storage Guardian closed with an error. Check Python installation and install.bat.
  pause
)
'''

files = {
    "storage_guardian.py": app_code,
    "README.md": readme,
    "install.bat": install_bat,
    "run.bat": run_bat,
}
for name, content in files.items():
    with open(os.path.join(base, name), "w", encoding="utf-8", newline="\n") as f:
        f.write(content)

zip_path = "/mnt/data/StorageGuardian_Windows.zip"
with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
    for name in files:
        zf.write(os.path.join(base, name), arcname=f"StorageGuardian/{name}")

print("Created project files:")
for name in files:
    print(f"- {os.path.join(base, name)}")
print(f"\nZIP: {zip_path}")
