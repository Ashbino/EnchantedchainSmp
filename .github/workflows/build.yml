APP_NAME = "Storage Guardian"
CURRENT_YEAR = datetime.now().year
PROTECTED_EXTENSIONS = {
    ".doc", ".docx", ".odt", ".rtf", ".pdf", ".txt", ".md",
    ".xls", ".xlsx", ".csv", ".ppt", ".pptx", ".odp", ".ods",
    ".py", ".pyw", ".js", ".ts", ".jsx", ".tsx", ".java", ".kt",
    ".c", ".cpp", ".h", ".hpp", ".cs", ".go", ".rs", ".php",
