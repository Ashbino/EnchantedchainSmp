        tk.Button(scanbox, text="Browse…", command=self.browse, bg="#343440", fg="white",
                  relief="flat", padx=12).grid(row=1, column=1, pady=8, padx=(0, 8))
        tk.Label(scanbox, text="Minimum size (MB)", bg="#1a1a22", fg="#c7c7d1").grid(row=1, column=2, padx=4)
        tk.Entry(scanbox, textvariable=self.min_size_var, width=7, bg="#25252f", fg="white",
                 insertbackground="white", relief="flat").grid(row=1, column=3, padx=4)
        tk.Label(scanbox, text="Old if not modified for (years)", bg="#1a1a22", fg="#c7c7d1").grid(row=1, column=4, padx=(10, 4))
        tk.Entry(scanbox, textvariable=self.age_var, width=5, bg="#25252f", fg="white",
                 insertbackground="white", relief="flat").grid(row=1, column=5, padx=4)
