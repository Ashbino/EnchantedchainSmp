        tk.Button(top, text="Refresh space", command=self.refresh_space, bg="#292934",
                  fg="white", relief="flat", padx=10).pack(side="left", pady=(10, 0))

        scanbox = tk.Frame(self.root, bg="#1a1a22", padx=14, pady=12)
        scanbox.pack(fill="x", padx=16, pady=(0, 10))
        tk.Label(scanbox, text="Scan location", bg="#1a1a22", fg="#e8c36a",
                 font=("Segoe UI", 10, "bold")).grid(row=0, column=0, sticky="w", columnspan=3)
        tk.Entry(scanbox, textvariable=self.folder_var, bg="#25252f", fg="white",
