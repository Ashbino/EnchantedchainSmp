        tk.Button(actions, text="Unselect all", command=self.unselect_all,
                  bg="#292934", fg="white", relief="flat", padx=12, pady=8).pack(side="left")
        tk.Button(actions, text="Delete selected…", command=self.delete_selected,
                  bg="#7d3838", fg="white", relief="flat", padx=12, pady=8).pack(side="right")
        tk.Button(actions, text="Empty Recycle Bin…", command=self.empty_recycle_bin,
                  bg="#292934", fg="#e8c36a", relief="flat", padx=12, pady=8).pack(side="right", padx=8)

        note = ("Click a row to toggle selection. Protected files are never auto-selected. "
                "Scanning is read-only; access dates may be disabled by Windows.")
        tk.Label(self.root, text=note, bg="#111116", fg="#aaaabb",
                 font=("Segoe UI", 9)).pack(anchor="w", padx=18, pady=(7, 5))

        columns = ("pick", "size", "modified", "accessed", "status", "path", "reason")
        self.tree = ttk.Treeview(self.root, columns=columns, show="headings", selectmode="browse")
        headings = {
            "pick": "✓", "size": "SIZE", "modified": "MODIFIED", "accessed": "LAST ACCESS*",
            "status": "CLASSIFICATION", "path": "FILE PATH", "reason": "WHY FLAGGED"
        }
        widths = {"pick": 35, "size": 90, "modified": 100, "accessed": 100,
                  "status": 155, "path": 330, "reason": 360}
        for col in columns:
            self.tree.heading(col, text=headings[col])
            self.tree.column(col, width=widths[col], minwidth=35, stretch=(col in ("path", "reason")))
        self.tree.pack(fill="both", expand=True, padx=16, pady=(0, 8))
        self.tree.bind("<Button-1>", self.on_tree_click)

        footer = tk.Frame(self.root, bg="#17171f", padx=16, pady=8)
        footer.pack(fill="x")
        self.progress = ttk.Progressbar(footer, mode="indeterminate")
        self.progress.pack(side="right", fill="x", expand=False, padx=(10, 0), ipadx=65)
        tk.Label(footer, textvariable=self.status_var, bg="#17171f", fg="#c7c7d1",
                 anchor="w").pack(side="left", fill="x", expand=True)

    def refresh_space(self):
        lines = []
        warning = False
        try:
            threshold = float(self.threshold_var.get())
        except ValueError:
            threshold = 15
        for drive in get_drive_roots():
            try:
                usage = shutil.disk_usage(drive)
                free_pct = usage.free / usage.total * 100 if usage.total else 0
                low = free_pct < threshold
                warning = warning or low
                lines.append(f"{drive}  {human_size(usage.free)} free of {human_size(usage.total)} ({free_pct:.1f}% free)" +
                             ("  ⚠ LOW SPACE" if low else ""))
            except OSError:
                continue
        self.space_var.set("     |     ".join(lines) if lines else "Disk space unavailable")
        if warning:
            self.status_var.set("Low storage detected. Scan first; nothing will be deleted automatically.")

    def browse(self):
        selected = filedialog.askdirectory(title="Choose a folder to scan", initialdir=self.folder_var.get())
        if selected:
            self.folder_var.set(selected)

    def start_scan(self):
        if self.scanning:
            return
        folder = os.path.abspath(os.path.expanduser(self.folder_var.get().strip().strip('"')))
        if not os.path.isdir(folder):
            messagebox.showerror(APP_NAME, "Choose a folder that exists.")
            return
        try:
            min_mb = float(self.min_size_var.get())
            age_years = float(self.age_var.get())
            if min_mb < 0 or age_years < 0:
                raise ValueError
        except ValueError:
            messagebox.showerror(APP_NAME, "Minimum size and age must be non-negative numbers.")
            return
        if not messagebox.askyesno(APP_NAME, f"Scan this folder and its subfolders?\n\n{folder}\n\nScanning is read-only and will not delete files."):
            return
        self.results.clear()
        self.checked.clear()
        self.tree.delete(*self.tree.get_children())
        self.scanning = True
        self.progress.start(10)
        self.status_var.set("Scanning… large files will be listed first.")
        worker = threading.Thread(target=self.scan_worker, args=(folder, min_mb, age_years), daemon=True)
        worker.start()

    def scan_worker(self, folder, min_mb, age_years):
        now = datetime.now()
        cutoff_seconds = age_years * 365.25 * 24 * 60 * 60
        min_bytes = min_mb * 1024 * 1024
        found = []
        count = 0
        skipped = 0
        for current, dirs, files in os.walk(folder, topdown=True, followlinks=False):
            dirs[:] = [d for d in dirs if d.lower() not in PROTECTED_DIR_NAMES and not os.path.islink(os.path.join(current, d))]
            for filename in files:
                path = os.path.join(current, filename)
                try:
                    if os.path.islink(path):
                        skipped += 1
                        continue
                    st = os.stat(path, follow_symlinks=False)
                    if not os.path.isfile(path) or st.st_size < min_bytes:
                        continue
                    count += 1
                    status, reason, protected = classify_file(path, st, now)
                    age = max(0, now.timestamp() - st.st_mtime)
                    if age >= cutoff_seconds and "Not modified for" not in reason:
                        reason = f"Not modified for {int(age // (365.25*24*3600))} year(s); " + reason
                        if status == "Review manually":
                            status = "Old file — review"
                    modified = datetime.fromtimestamp(st.st_mtime)
                    accessed = datetime.fromtimestamp(st.st_atime)
                    low_risk = Path(path).suffix.lower() in LOW_RISK_EXTENSIONS or Path(path).parent.name.lower() in LIKELY_LOW_RISK_DIRS
                    found.append({
                        "path": path, "size": st.st_size, "modified": modified,
                        "accessed": accessed, "status": status, "reason": reason,
                        "protected": protected, "low_risk": low_risk, "age": age,
                    })
                except (PermissionError, FileNotFoundError, OSError):
                    skipped += 1
            if count and count % 100 == 0:
                self.scan_queue.put(("progress", count, len(found)))
        found.sort(key=lambda item: item["size"], reverse=True)
        self.scan_queue.put(("done", found, count, skipped))

    def poll_queue(self):
        try:
            while True:
                item = self.scan_queue.get_nowait()
                if item[0] == "progress":
                    self.status_var.set(f"Scanning… checked {item[1]:,} qualifying files so far.")
                elif item[0] == "done":
                    _, found, count, skipped = item
                    self.results = found
                    for i, item_data in enumerate(found):
                        self.insert_result(i, item_data)
                    self.scanning = False
                    self.progress.stop()
                    self.status_var.set(f"Scan complete: {len(found):,} files listed; {skipped:,} items skipped or inaccessible. No files deleted.")
        except queue.Empty:
            pass
        self.root.after(150, self.poll_queue)

    def insert_result(self, index, data):
        key = str(index)
        picked = "☐" if index not in self.checked else "☑"
        self.tree.insert("", "end", iid=key, values=(
            picked, human_size(data["size"]), data["modified"].strftime("%Y-%m-%d"),
            data["accessed"].strftime("%Y-%m-%d"), data["status"], data["path"], data["reason"]
        ))

    def on_tree_click(self, event):
        region = self.tree.identify("region", event.x, event.y)
        row = self.tree.identify_row(event.y)
        col = self.tree.identify_column(event.x)
        if region == "cell" and row:
            index = int(row)
            data = self.results[index]
            if data["protected"]:
                messagebox.showinfo(APP_NAME, "This file is protected by default because it may be important or recent. You can still review its details, but this tool won't let you select protected files for deletion.")
                return "break"
            if index in self.checked:
                self.checked.remove(index)
            else:
                self.checked.add(index)
            values = list(self.tree.item(row, "values"))
            values[0] = "☑" if index in self.checked else "☐"
            self.tree.item(row, values=values)
            return "break"

    def select_safe(self):
        self.checked.clear()
        for i, item in enumerate(self.results):
            if not item["protected"] and item["low_risk"] and item["age"] >= DEFAULT_MIN_AGE_DAYS:
                self.checked.add(i)
        for i, item in enumerate(self.results):
            row = str(i)
            values = list(self.tree.item(row, "values"))
            values[0] = "☑" if i in self.checked else "☐"
            self.tree.item(row, values=values)
        total = sum(self.results[i]["size"] for i in self.checked)
        self.status_var.set(f"Selected {len(self.checked)} old, lower-risk candidates ({human_size(total)}). Review before deleting.")

    def unselect_all(self):
        self.checked.clear()
        for i in range(len(self.results)):
            row = str(i)
            values = list(self.tree.item(row, "values"))
            values[0] = "☐"
            self.tree.item(row, values=values)
        self.status_var.set("All files unselected.")

    def delete_selected(self):
        if not self.checked:
            messagebox.showinfo(APP_NAME, "No files selected. Click a file row to select it, or use Select safe candidates.")
            return
        if send2trash is None:
            messagebox.showerror(APP_NAME, "The send2trash package is missing.\n\nRun install.bat from the project folder, then reopen the app. No files were deleted.")
            return
        chosen = [self.results[i] for i in sorted(self.checked)]
        total = sum(item["size"] for item in chosen)
        preview = "\n".join(item["path"] for item in chosen[:8])
        if len(chosen) > 8:
            preview += f"\n…and {len(chosen)-8} more files"
        answer = messagebox.askyesno(APP_NAME,
            f"Move {len(chosen)} selected file(s) to the Recycle Bin?\nEstimated total: {human_size(total)}\n\n{preview}\n\nThis is the last review before the files are moved.")
        if not answer:
            return
        moved = 0
        errors = []
        for item in chosen:
            try:
                # Re-check protected location and file existence immediately before acting.
                path = item["path"]
                if item["protected"] or not os.path.isfile(path) or os.path.islink(path):
                    errors.append(path)
                    continue
                send2trash(path)
                moved += 1
            except Exception:
                errors.append(item["path"])
        self.status_var.set(f"Moved {moved} file(s) to Recycle Bin; {len(errors)} failed.")
        message = f"Moved {moved} file(s) to the Recycle Bin."
        if errors:
            message += f"\n\n{len(errors)} item(s) could not be moved. They were not forcibly deleted."
        messagebox.showinfo(APP_NAME, message)
        self.unselect_all()
        self.refresh_space()
        if moved:
            if messagebox.askyesno(APP_NAME, "Cleanup finished.\n\nDo you want to EMPTY THE RECYCLE BIN now?\n\nThis can make deleted files much harder or impossible to recover."):
                self.empty_recycle_bin(confirm_again=False)
        self.start_scan_after_cleanup()

    def start_scan_after_cleanup(self):
        # Refresh the display after cleanup without immediately triggering a new scan.
        self.refresh_space()

    def empty_recycle_bin(self, confirm_again=True):
        if os.name != "nt":
            messagebox.showerror(APP_NAME, "Emptying the Recycle Bin is only supported on Windows.")
            return
        if confirm_again:
            if not messagebox.askyesno(APP_NAME,
                "Permanently empty the Windows Recycle Bin?\n\nThis removes the ability to restore items from it. Make sure you do not need anything inside."):
                return
        try:
            # SHERB_NOCONFIRMATION | SHERB_NOPROGRESSUI | SHERB_NOSOUND
            result = ctypes.windll.shell32.SHEmptyRecycleBinW(None, None, 0x00000001 | 0x00000002 | 0x00000004)
            if result == 0:
                messagebox.showinfo(APP_NAME, "Recycle Bin emptied.")
            else:
                messagebox.showwarning(APP_NAME, f"Windows reported a problem emptying the Recycle Bin (code {result}).")
        except Exception as exc:
            messagebox.showerror(APP_NAME, f"Could not empty the Recycle Bin:\n{exc}")


def main():
    root = tk.Tk()
    app = StorageGuardianApp(root)
    root.mainloop()


if __name__ == "__main__":
    main()
'''

readme = r'''# Storage Guardian (Windows 11)

A small Python desktop utility to help find large, old files and review them before cleanup.

## Safety behaviour
- Scanning is read-only.
- Files are sorted largest first.
- Common document, schoolwork, code, design, and project file types are protected.
- Files modified or apparently accessed in the current calendar year are protected by default.
- Windows, Program Files, ProgramData, AppData, virtual environments, and common dependency folders are excluded from scanning.
- Selected files are moved to the Recycle Bin, not permanently deleted.
- Emptying the Recycle Bin requires a separate confirmation.
- Windows may disable or delay last-access timestamp updates, so the app treats access dates as a clue, not proof.

## Install
1. Install Python 3.11 or newer from https://www.python.org/downloads/windows/
2. During setup, enable **Add Python to PATH**.
3. Extract this ZIP to a normal folder such as `Documents\StorageGuardian`.
4. Double-click `install.bat`.
5. Double-click `run.bat`.

If Windows blocks a batch file, right-click it and choose **Open** or run the commands below in Command Prompt from the project folder.

## Manual setup
```bat
py -m pip install --upgrade pip
py -m pip install send2trash
py storage_guardian.py
```

Tkinter is included with most standard Windows Python installers.

## How to use
1. Choose a folder with **Browse…**. Start with Downloads, not the whole C: drive.
2. Set minimum size and age values.
3. Click **START SCAN**.
4. Results are sorted largest first.
5. Click a row to select or unselect it. Protected files cannot be selected.
6. **Select safe candidates** selects only old, lower-risk files; review the list.
7. Click **Delete selected…** to move selected files to the Recycle Bin.
8. Only if you are sure, separately confirm emptying the Recycle Bin.

## Notes
- This first version does not run as a background service. Open it when you want to check storage.
- Do not scan the entire Windows drive for your first test. Start with Downloads or another personal folder.
- A file's age alone does not prove it is useless. Review each selected item.
- Use the official Windows Storage settings for built-in temporary-file cleanup.
'''

