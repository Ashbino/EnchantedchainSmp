        actions = tk.Frame(self.root, bg="#111116", padx=16, pady=3)
        actions.pack(fill="x")
        tk.Button(actions, text="▶  START SCAN", command=self.start_scan, bg="#d5ad50",
                  fg="#17130a", font=("Segoe UI", 10, "bold"), relief="flat",
