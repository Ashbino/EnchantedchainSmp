    def _build_ui(self):
        header = tk.Frame(self.root, bg="#17171f", padx=18, pady=14)
        header.pack(fill="x")
        tk.Label(header, text="♛  STORAGE GUARDIAN", bg="#17171f", fg="#e8c36a",
                 font=("Segoe UI", 19, "bold")).pack(side="left")
        tk.Label(header, text="SAFE CLEANUP • WINDOWS 11", bg="#17171f", fg="#aaaabb",
                 font=("Segoe UI", 9)).pack(side="right", pady=8)

        top = tk.Frame(self.root, bg="#111116", padx=16, pady=12)
        top.pack(fill="x")
        tk.Label(top, textvariable=self.space_var, bg="#111116", fg="#f2f2f5",
                 font=("Segoe UI", 11, "bold")).pack(anchor="w")
        tk.Label(top, text="Low-space warning threshold (% free):", bg="#111116",
