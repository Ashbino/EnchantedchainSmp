    ".sql", ".ipynb", ".sln", ".csproj", ".gradle", ".properties",
    ".blend", ".psd", ".kra", ".xcf", ".ase", ".aseprite",
}
PROTECTED_DIR_NAMES = {
    "windows", "program files", "program files (x86)", "programdata",
    "$recycle.bin", "system volume information", "appdata",
    ".git", "node_modules", ".venv", "venv", "env",
}
LIKELY_LOW_RISK_DIRS = {"downloads", "temp", "tmp"}
LOW_RISK_EXTENSIONS = {
    ".tmp", ".temp", ".log", ".dmp", ".old", ".bak",
    ".msi", ".exe", ".zip", ".rar", ".7z", ".iso",
}
DEFAULT_MIN_AGE_DAYS = 365 * 2


def human_size(num):
    units = ["B", "KB", "MB", "GB", "TB"]
    value = float(num)
    for unit in units:
        if value < 1024 or unit == units[-1]:
            return f"{value:.1f} {unit}" if unit != "B" else f"{int(value)} B"
        value /= 1024


def get_drive_roots():
    if os.name == "nt":
        roots = []
        for letter in "ABCDEFGHIJKLMNOPQRSTUVWXYZ":
            root = f"{letter}:\\"
            if os.path.exists(root):
                roots.append(root)
        return roots
    return ["/"]


def is_within(path, root):
    try:
        return os.path.commonpath([os.path.abspath(path), os.path.abspath(root)]).lower() == os.path.abspath(root).lower()
    except (ValueError, OSError):
        return False


def classify_file(path, stat_result, now):
    p = Path(path)
    ext = p.suffix.lower()
    parts = {part.lower() for part in p.parts}
    modified = datetime.fromtimestamp(stat_result.st_mtime)
    accessed = datetime.fromtimestamp(stat_result.st_atime)
    age_days = max(0, (now - modified).days)

    reasons = []
    protected = False

    if ext in PROTECTED_EXTENSIONS:
        protected = True
        reasons.append("Likely important document/project file")
    if modified.year == CURRENT_YEAR or accessed.year == CURRENT_YEAR:
        protected = True
        reasons.append(f"Modified/accessed in {CURRENT_YEAR} (access time may be unreliable)")
    if any(part in PROTECTED_DIR_NAMES for part in parts):
        protected = True
        reasons.append("Protected/system/application location")

    parent_names = {part.lower() for part in p.parent.parts}
    low_risk = ext in LOW_RISK_EXTENSIONS or bool(parent_names & LIKELY_LOW_RISK_DIRS)
    if low_risk:
        reasons.append("Potential cleanup candidate (review before deleting)")
    if age_days >= DEFAULT_MIN_AGE_DAYS:
        reasons.append(f"Not modified for {age_days // 365} year(s)")
    elif not reasons:
        reasons.append("Large file; review manually")

    if protected:
        status = "PROTECTED"
    elif low_risk and age_days >= DEFAULT_MIN_AGE_DAYS:
        status = "Review candidate"
    elif age_days >= DEFAULT_MIN_AGE_DAYS:
        status = "Old file — review"
    else:
        status = "Review manually"

    return status, "; ".join(reasons), protected


class StorageGuardianApp:
    def __init__(self, root):
