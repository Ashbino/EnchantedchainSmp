# Enchain - any item, any enchant, no limits.

anvil:
  # Master switch for the any-enchant anvil.
  enabled: true
  # Let enchanted ITEMS (not just books) be the sacrifice in the right slot.
  # Their enchants get moved onto the item in the left slot.
  allow-item-transfer: true
  # XP level cost added per enchant level applied.
  cost-per-level: 2
  # Raises the anvil "Too Expensive!" limit (vanilla is 40).
  max-cost: 200

levels:
  # Allow combining past the vanilla max level (e.g. Sharpness V + V = VI).
  allow-above-vanilla-max: true
  # Highest level the anvil will ever produce (1-255).
  max-level: 10
  # Two books/items with the same level combine into level + 1.
  combine-same-level: true
