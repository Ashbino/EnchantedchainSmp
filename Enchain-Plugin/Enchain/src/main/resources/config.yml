# Enchain - any item, any enchant, no limits.

anvil:
  # Master switch for the any-enchant anvil.
  enabled: true
  # Let enchanted ITEMS (not just books) be the sacrifice in the right slot.
  # Their enchants get moved onto the item in the left slot.
  allow-item-transfer: true
  # XP level cost added per enchant level applied.
  cost-per-level: 2
  # Raises the anvil "Too Expensive!" limit (vanilla is 40).
  max-cost: 200

levels:
  # Allow combining past the vanilla max level (e.g. Sharpness V + V = VI).
  allow-above-vanilla-max: true
  # Highest level the anvil will ever produce (1-255).
  max-level: 10
  # Two books/items with the same level combine into level + 1.
  combine-same-level: true

# Makes enchants actually work on items they normally don't.
emulation:
  density:
    # Density on ANY item = mace smash attack (fall damage bonus, Wind Burst launch).
    enabled: true
  blast-protection:
    # Blast Protection on throwables/arrows = explodes on hit,
    # on tools = explodes the block you break, on weapons = explodes what you hit.
    enabled: true
    projectiles: true
    tools: true
    weapons: true
    weapons-break-blocks: false
    break-blocks: true
    # The player who caused the blast takes no explosion damage.
    protect-owner: true
    max-power: 8.0
  loyalty:
    # Loyalty on ANY item: right-click to throw it (shift + right-click on blocks), it flies back.
    # Sharpness, Fire Aspect, Knockback and Channeling apply to the thrown item.
    enabled: true
    throw-speed: 1.8
    base-damage: 6.0
    durability-loss: 1
    cooldown-ms: 400
    channeling-lightning: true
